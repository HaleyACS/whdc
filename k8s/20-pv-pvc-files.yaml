---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: "whdc"
  name: "whdc-nfs-files"
  labels:
    type: local
spec:
  storageClassName: "manual"
  claimRef:
    name: "whdc-pvc-files"
    namespace: "whdc"
  capacity:
    storage: 10Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/whdc/files
status: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: "whdc"
  name: "whdc-pvc-files"
spec:
  storageClassName: "manual"
  volumeName: "whdc-nfs-files"
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
status: {}
